main{flex:1;overflow-y:auto;padding:12px 14px 24px;position:relative;z-index:1;-webkit-overflow-scrolling:touch}
header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:12px}
h1{font-size:24px;letter-spacing:.12em;font-weight:800;line-height:1.1}
h1 i{color:var(--ac);font-style:normal}
.sub{font-size:10px;letter-spacing:.28em;color:var(--mut);margin-top:5px}
.pill{border:1.5px solid var(--ac2);border-radius:20px;padding:7px 12px;font-size:11px;letter-spacing:.13em;color:var(--mut);display:flex;gap:7px;align-items:center;background:#0006;cursor:pointer;font:inherit}
.pill b{width:9px;height:9px;border-radius:50%;background:var(--mut);flex:none}
.pill.on{color:var(--ac)}.pill.on b{background:var(--ac);box-shadow:0 0 8px var(--ac)}
.card{background:#0b1424d9;border:1px solid var(--line);border-radius:24px;padding:16px;margin-bottom:12px;backdrop-filter:blur(6px)}
.lab{font-size:11px;letter-spacing:.28em;color:var(--mut);margin-bottom:12px}
button{font:inherit;color:var(--tx);cursor:pointer}
.btn{flex:1;height:56px;border-radius:20px;border:1px solid var(--line);background:#1b2538;font-weight:700;font-size:15px}
.btn.sm{height:42px;font-size:13px;border-radius:14px}
.btn.act{background:var(--ac);color:#0a1a05}
.hint{font-size:13px;color:var(--mut);margin:6px 4px}
.seg{display:flex;gap:8px;margin-bottom:12px}.seg .btn.sm{padding:0 4px}
.tab{display:none}.tab.on{display:block}
#fgMode button{flex:1;height:42px;border-radius:14px;border:1px solid var(--line);background:#1b2538;font-weight:700;font-size:13px;color:var(--tx)}
#fgMode button.act{background:var(--ac);color:#0a1a05;border-color:transparent}
#foot{text-align:center;font-size:9.5px;color:var(--mut);letter-spacing:.12em;padding:2px 0 8px}

/* ===== 15:30 FINGERING tab: paper-style chart list (all notes at a glance) + tap-to-enlarge ===== */
#fgInst{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0 4px;scrollbar-width:none}
#fgInst::-webkit-scrollbar{display:none}
#fgInst .btn{flex:none;height:34px;padding:0 15px;border-radius:999px;font-size:12.5px}
#fgChart{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;align-items:start}
#fgChart svg *{filter:none!important}
.fgOct{grid-column:1/-1;display:flex;align-items:center;gap:8px;color:var(--mut);font:700 9.5px Inter,sans-serif;letter-spacing:.22em;margin-top:3px}
.fgOct:before,.fgOct:after{content:'';flex:1;height:1px;background:var(--line)}
.fgCell{border:1px solid var(--line);border-radius:14px;background:rgba(255,255,255,.045);padding:7px 3px 6px;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
.fgCellNm{font:800 15px Inter,sans-serif;line-height:1.1}
.fgCellNm .fgF{font-size:1.05em}
.fgMain{height:102px;display:flex;align-items:center;justify-content:center;margin-top:2px}
.fgMain svg{height:100%;width:auto;max-width:100%;display:block}
#fgChart.valves .fgMain,#fgChart.slide .fgMain{height:74px}
#fgChart[data-inst="fl"] .fgMain{height:68px}
.fgPos{font-size:9.5px;color:var(--mut);letter-spacing:.12em;margin-top:2px;font-weight:700}
.fgAltRow{display:flex;gap:4px;justify-content:center;margin-top:5px;border-top:1px dashed var(--line);padding-top:5px}
.fgAltCell{flex:1;min-width:0;max-width:54px}
.fgAltMini{height:52px;display:flex;align-items:center;justify-content:center}
.fgAltMini svg{height:100%;width:auto;max-width:100%;display:block}
#fgChart.valves .fgAltMini,#fgChart.slide .fgAltMini{height:42px}
#fgChart[data-inst="fl"] .fgAltMini{height:40px}
.fgAltCap{font-size:8.5px;color:var(--ac);font-weight:700;letter-spacing:.05em;margin-top:1px;white-space:nowrap}
.fgCell.sel{border-color:var(--ac);box-shadow:0 0 0 1px var(--ac),0 0 14px rgb(var(--acrgb)/.30)}
.fgCell.live{border-color:var(--ac);background:rgb(var(--acrgb)/.13);box-shadow:0 0 0 2px var(--ac),0 0 20px rgb(var(--acrgb)/.60)}
/* ===== 16:30 fingering readability / access polish ===== */
.fgCellNm{font-size:16.5px}
.fgAltCap{font-size:9.5px}
.fgScNm{font-size:10.5px}
.fgPos{font-size:10.5px}
.fgOct{scroll-margin-top:150px}
.fgCell.live .fgCellNm{color:var(--ac)}
html[data-lt='1'] .fgCell.live .fgCellNm{color:var(--acdk)}
html[data-lt='1'] .fgCell,html[data-lt='1'] .fgScCell{background:rgba(58,44,18,.07);border-color:rgba(58,44,18,.25)}
#t7 .fgTop{position:sticky;top:6px;z-index:6;box-shadow:0 12px 26px rgba(2,6,12,.38)}
html[data-lt='1'] #t7 .fgTop{box-shadow:0 12px 26px rgba(80,60,20,.20)}
#fgJump{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:9px}
#fgJump button{min-height:36px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.05);color:var(--tx);font:700 11px Inter,sans-serif;letter-spacing:.08em;cursor:pointer}
#fgJump button:active{border-color:var(--ac);color:var(--ac)}
html[data-lt='1'] #fgJump button{background:rgba(58,44,18,.07)}
/* C major scale strip */
#fgScale{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:2px 0;scrollbar-width:none}
#fgScale::-webkit-scrollbar{display:none}
#fgScale svg *{filter:none!important}
.fgScCell{flex:none;width:64px;border:1px solid var(--line);border-radius:12px;background:rgba(255,255,255,.045);padding:5px 2px 4px;text-align:center;cursor:pointer;-webkit-tap-highlight-color:transparent}

.fgScSvg svg{height:100%;width:auto;max-width:100%;display:block}

.fgScSol{font:800 12.5px Inter,sans-serif;color:var(--ac);margin-top:2px}
.fgScNm{font-size:9.5px;color:var(--mut);font-weight:700}
/* enlarged view (modal) */
#fgModal{position:fixed;inset:0;z-index:80;display:none;background:rgba(3,6,12,.74);padding:18px 12px calc(18px + env(safe-area-inset-bottom,0px));overflow-y:auto;-webkit-overflow-scrolling:touch}
#fgModal.on{display:block}
.fgMPanel{position:relative;max-width:440px;margin:2vh auto 0}

#fgName{font-size:38px;font-weight:800;text-align:center;line-height:1.02}

#fgSub{text-align:center;color:var(--mut);font-size:11px;letter-spacing:.14em;margin-top:1px}
#fgSvgWrap{display:flex;justify-content:center;padding:0}

#fgAlt{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;margin-top:2px}
#fgAltTag{text-align:center;color:var(--ac);font-size:12px;font-weight:700;min-height:16px;margin-top:4px;letter-spacing:.05em}

function detect(b,sr){const N=2048,min=sr/1200|0,max=Math.min(sr/60|0,b.length-N),r=new Float32Array(max+2);let g=0;
 for(let l=min;l<=max;l++){let s=0;for(let i=0;i<N;i++)s+=b[i]*b[i+l];r[l]=s;if(s>g)g=s}
 let r0=0;for(let i=0;i<N;i++)r0+=b[i]*b[i];if(g/r0<.35)return 0;
 for(let l=min+1;l<max;l++)if(r[l]>=.85*g&&r[l]>r[l-1]&&r[l]>=r[l+1]){const a=r[l-1],c=r[l],d=r[l+1],p=(a-d)/(2*(a-2*c+d))||0;return sr/(l+p)}return 0}
var micBtn=document.getElementById('micBtn');
function micUI(){micBtn.innerHTML='<b></b>'+(micOn?'MIC ON':'MIC');micBtn.classList.toggle('on',micOn)}
function micLoop(){if(!micOn||!an)return;requestAnimationFrame(micLoop);
 an.getFloatTimeDomainData(buf);let s=0;for(let i=0;i<buf.length;i++){const v=buf[i];s+=v*v}
 if(Math.sqrt(s/buf.length)>.0035){const f=detect(buf,ac.sampleRate);if(f){F0=f;F0t=performance.now()}}}
async function toggleMic(){
 if(micOn){micOn=false;if(micStream)micStream.getTracks().forEach(function(t){t.stop()});micStream=null;an=null;micUI();return}
 try{
  if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)();
  if(ac.state==='suspended')await ac.resume();
  micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
  an=ac.createAnalyser();an.fftSize=4096;ac.createMediaStreamSource(micStream).connect(an);
  buf=new Float32Array(an.fftSize);micOn=true;micUI();micLoop();
 }catch(e){micOn=false;micUI()}
}
micBtn.onclick=toggleMic;micUI();
